# Local development stack: `docker compose up --build`
# Values come from the root .env file (copy .env.example). Defaults are local-only.

name: recliniq

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recliniq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recliniq}
      POSTGRES_DB: ${POSTGRES_DB:-recliniq}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      APP_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-recliniq}:${POSTGRES_PASSWORD:-recliniq}@db:5432/${POSTGRES_DB:-recliniq}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
      WATCHFILES_FORCE_POLLING: ${DEV_WATCH_POLLING:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
      DEV_WATCH_POLLING: ${DEV_WATCH_POLLING:-true}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
